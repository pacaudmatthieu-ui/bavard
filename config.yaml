stt:
  engine: faster-whisper      # faster-whisper | mlx-whisper (optional faster path)
  model: small                # tiny.en | base | small | medium | large-v3
  language: fr                # null = auto-detect, or e.g. "en" / "fr"
  compute_type: int8          # int8 is fastest on CPU for CTranslate2

llm:
  enabled: true
  # to change the LLM: edit llm.model below, then restart
  model: qwen3:4b-instruct
  base_url: http://localhost:11434
  temperature: 0.1
  min_words_for_cleanup: 10   # utterances under this word count skip Ollama entirely
  system_prompt: |
    You are a transcript cleaner. You receive raw speech-to-text output in any
    language (often French). Keep every word EXACTLY as spoken — same words,
    same order, same language. Your ONLY edits: 1) delete ALL filler words (um,
    uh, like, euh, ben, bah, hein), including at the very start of the text,
    2) add punctuation and apostrophes, 3) capitalize sentence starts and
    proper nouns, 4) in texts longer than two sentences, insert a blank line
    between distinct ideas. NEVER translate. NEVER summarize, rephrase, or add
    content. Output ONLY the cleaned text.

    Example input: euh alors premier sujet il faut valider le budget je pense que c est bon ensuite euh pour la réunion de jeudi on décale à quatorze heures
    Example output: Alors, premier sujet : il faut valider le budget, je pense que c est bon.

    Ensuite, pour la réunion de jeudi, on décale à quatorze heures.

hotkey:
  # single key (alt_r, ctrl_r, f13) or a chord like "ctrl+alt".
  # note: macOS does not let apps see the fn key, so fn cannot be used.
  key: ctrl+shift
  # hold = record while keys are held | toggle = press once to start, again to stop
  mode: toggle

audio:
  sample_rate: 16000
  channels: 1
  preroll_ms: 500             # ring buffer so the first word isn't clipped
  keep_open: false            # false = mic opens only while dictating (no orange
                              # mic icon when idle); true = always-on + preroll

inject:
  method: paste               # paste (clipboard + synthesized Cmd+V) | type (per-char CGEvent)
  restore_clipboard: true

# Modes de dictée : la mise en forme s'adapte à l'endroit où vous écrivez.
# En automatique, Bavard reconnaît l'app active au moment où vous appuyez sur
# le raccourci (E-mail dans Mail / Gmail / Outlook, Message court dans Slack ou
# Messages, Technique dans un terminal ou un éditeur de code, Notes dans Notes
# ou Notion, Texte standard partout ailleurs). Menu 🎙️ → Mode de dictée pour
# épingler un mode. Vos propres modes : ~/Documents/Bavard/modes.yaml
modes:
  enabled: true
  default: auto            # auto = d'après l'app active ; ou une clé de mode
  email_signature: false   # true = ajouter votre signature en mode E-mail.
                           # À n'activer que si vous ne dictez PAS votre
                           # formule de politesse, sinon vous en aurez deux.
  user_modes: ~/Documents/Bavard/modes.yaml

# Contexte personnel : qui vous êtes, vos liens, votre vocabulaire métier.
# Le fichier reste sur votre Mac — jamais versionné, jamais envoyé nulle part.
# Menu 🎙️ → « Mon contexte… » pour l'ouvrir.
context:
  enabled: true
  path: ~/Documents/Bavard/contexte.md

# NOTE micro : Bavard enregistre par défaut avec le micro intégré du Mac, même
# si l'entrée système est réglée ailleurs. Pour changer de micro : icône 🎙️
# de la barre de menu → Micro (choix mémorisé dans state.json).

meeting:
  output_dir: ~/Documents/Bavard   # un dossier « Réunion AAAA-MM-JJ HHhMM » par enregistrement
  keep_audio: true                 # false = supprimer audio.wav après transcription

# Filet de sécurité : chaque dictée est écrite sur le disque dès que la
# transcription existe — avant le nettoyage et avant le collage. Rien ne se
# perd si aucun champ de texte n'était sélectionné, si l'app cible avale le
# collage ou si Bavard plante en cours de route. Menu 🎙️ → « Historique des
# dictées » pour relire ou recoller.
history:
  enabled: true
  dir: ~/Documents/Bavard/historique
  keep_days: 90          # ancienneté max du journal et des audios (0 = illimité) ;
                         # les archives Markdown mensuelles ne sont jamais purgées
  keep_audio: false      # true = garder aussi le WAV de chaque dictée, pour
                         # retranscrire un passage si le micro a coupé
                         # (≈ 30 Ko par 10 s ; purgé après keep_days)
  menu_entries: 10       # nombre de dictées listées dans le menu
